<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Combo Asistan - 6. Sınıf Ders Yardımcısı</title>
<style>
:root {
  --primary: #4f46e5;
  --primary-dark: #3730a3;
  --secondary: #06b6d4;
  --bg: #0f172a;
  --card: #1e293b;
  --card-hover: #334155;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --accent: #22c55e;
  --sidebar-w: 220px;
  --header-h: 56px;
  --radius: 14px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* HEADER */
header {
  height: var(--header-h);
  min-height: var(--header-h);
  background: rgba(30,41,59,0.98);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  z-index: 50;
  flex-shrink: 0;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: clamp(0.95rem, 3.5vw, 1.25rem);
}
.logo img {
  width: 40px; height: 40px;
  border-radius: 50%;
  object-fit: cover;
  background: #1e293b;
  border: 2px solid var(--secondary);
}
.badge {
  background: var(--accent);
  color: #000;
  font-size: 0.65rem;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 700;
}
.menu-toggle {
  display: none;
  background: var(--card);
  border: 1px solid #475569;
  color: var(--text);
  width: 40px; height: 40px;
  border-radius: 10px;
  font-size: 1.3rem;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

/* LAYOUT */
.app-body {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: #1e293b;
  border-right: 1px solid rgba(255,255,255,0.07);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform 0.3s ease, width 0.3s ease;
  z-index: 40;
}
.sidebar-title {
  padding: 14px 12px 8px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  font-weight: 600;
  flex-shrink: 0;
}
.subject-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.subject-btn {
  background: transparent;
  border: none;
  color: var(--text);
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 500;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.2s, color 0.2s;
  white-space: nowrap;
}
.subject-btn:hover { background: var(--card-hover); }
.subject-btn.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  font-weight: 600;
}
.subject-btn .icon { font-size: 1.15rem; width: 24px; text-align: center; flex-shrink: 0; }

/* MAIN CHAT */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.chat-header {
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  padding: 10px 14px;
  font-weight: 600;
  font-size: clamp(0.85rem, 2.8vw, 0.95rem);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.chat-header img {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
  min-height: 0;
  -webkit-overflow-scrolling: touch;
}
.message {
  max-width: 88%;
  padding: 11px 14px;
  border-radius: 16px;
  line-height: 1.55;
  font-size: clamp(0.84rem, 2.6vw, 0.93rem);
  animation: fadeIn 0.25s ease;
  word-wrap: break-word;
  white-space: pre-wrap;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.message.bot {
  background: #334155;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.message.bot .avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  object-fit: cover;
  background: #1e293b;
}
.message.bot .bubble { flex: 1; min-width: 0; }
.message.user {
  background: linear-gradient(135deg, var(--primary), #6366f1);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

/* QUICK TOPICS - fixed height, scrollable */
.quick-topics {
  padding: 8px 10px;
  display: flex;
  flex-wrap: nowrap;
  gap: 6px;
  background: rgba(0,0,0,0.25);
  border-top: 1px solid rgba(255,255,255,0.05);
  overflow-x: auto;
  overflow-y: hidden;
  flex-shrink: 0;
  max-height: 52px;
  -webkit-overflow-scrolling: touch;
}
.topic-chip {
  background: rgba(79,70,229,0.3);
  border: 1px solid rgba(79,70,229,0.55);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 18px;
  font-size: 0.78rem;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.topic-chip:hover { background: var(--primary); transform: scale(1.04); }

/* INPUT */
.input-area {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(0,0,0,0.3);
  border-top: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
#userInput {
  flex: 1;
  background: #0f172a;
  border: 2px solid #334155;
  border-radius: 22px;
  padding: 11px 16px;
  color: var(--text);
  font-size: clamp(0.85rem, 2.6vw, 0.95rem);
  outline: none;
}
#userInput:focus { border-color: var(--primary); }
#userInput::placeholder { color: var(--text-muted); }
.send-btn {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border: none;
  width: 46px; height: 46px;
  border-radius: 50%;
  color: white;
  font-size: 1.15rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.send-btn:hover { transform: scale(1.07); }
.send-btn:disabled { opacity: 1; cursor: pointer; transform: none; } /* kilit görünümü kaldırıldı */

/* OVERLAY for mobile sidebar */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 35;
  pointer-events: none;
}
.sidebar-overlay.open { pointer-events: auto; }

/* SCROLLBARS */
.subject-list::-webkit-scrollbar,
.chat-messages::-webkit-scrollbar,
.quick-topics::-webkit-scrollbar { width: 5px; height: 5px; }
.subject-list::-webkit-scrollbar-thumb,
.chat-messages::-webkit-scrollbar-thumb,
.quick-topics::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

/* MOBILE */
@media (max-width: 768px) {
  .menu-toggle { display: flex; }
  .sidebar {
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    transform: translateX(-100%);
    box-shadow: 4px 0 24px rgba(0,0,0,0.4);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .message { max-width: 94%; }
}
@media (min-width: 769px) and (max-width: 1024px) {
  :root { --sidebar-w: 190px; }
  .subject-btn { font-size: 0.82rem; padding: 9px 10px; }
}
@media (min-width: 1025px) {
  :root { --sidebar-w: 230px; }
}

.welcome-box {
  text-align: center;
  padding: 24px 16px;
  color: var(--text-muted);
  margin: auto;
}
.welcome-box img {
  width: 90px; height: 90px;
  border-radius: 50%;
  margin-bottom: 12px;
  border: 3px solid var(--secondary);
}
.welcome-box h2 {
  color: var(--text);
  margin-bottom: 8px;
  font-size: clamp(1.05rem, 3.5vw, 1.3rem);
}
</style>

function normalize(text) {
  return text.toLowerCase()
    .replace(/ı/g, "i").replace(/İ/g, "i")
    .replace(/ğ/g, "g").replace(/ü/g, "u")
    .replace(/ş/g, "s").replace(/ö/g, "o")
    .replace(/ç/g, "c")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function findAnswer(query) {
  const q = normalize(query);
  const subjectsToSearch = currentSubject === "genel" ? Object.keys(knowledge) : [currentSubject];
  let best = null;
  let bestScore = 0;

  for (const sub of subjectsToSearch) {
    const entries = knowledge[sub]?.entries || {};
    for (const [id, data] of Object.entries(entries)) {
      const keyList = data.keys || [];
      for (const key of keyList) {
        const nk = normalize(key);
        // exact or contains
        if (q === nk) {
          return { ...data, subject: sub };
        }
        if (q.includes(nk) && nk.length >= 3) {
          const score = nk.length + 40;
          if (score > bestScore) {
            bestScore = score;
            best = { ...data, subject: sub };
          }
        }
        if (nk.includes(q) && q.length >= 3) {
          const score = q.length + 20;
          if (score > bestScore) {
            bestScore = score;
            best = { ...data, subject: sub };
          }
        }
      }
      // word overlap
      const qWords = q.split(" ").filter(w => w.length > 2);
      for (const key of keyList) {
        const nk = normalize(key);
        const kWords = nk.split(" ");
        let hits = 0;
        for (const w of qWords) {
          if (kWords.some(kw => kw.includes(w) || w.includes(kw))) hits++;
        }
        if (hits > 0) {
          const score = hits * 15 + (hits === qWords.length ? 30 : 0);
          if (score > bestScore) {
            bestScore = score;
            best = { ...data, subject: sub };
          }
        }
      }
    }
  }
  return best;
}

function extractWordForTDK(query) {
  // "bakraç nedir", "bakrac ne demek", "X ne anlama gelir" vb.
  let q = query.trim();
  const patterns = [
    /^(.+?)\s+(nedir|ne demek|ne anlama gelir|ne anlama|anlami nedir|anlamı nedir|ne demektir)\s*\??$/i,
    /^(nedir|ne demek)\s+(.+?)\s*\??$/i
  ];
  for (const p of patterns) {
    const m = q.match(p);
    if (m) {
      const word = (m[1] && !/^(nedir|ne demek)/i.test(m[1]) ? m[1] : m[2] || "").trim();
      if (word && word.length >= 2 && word.length < 40) return word;
    }
  }
  // tek kelime + nedir yoksa ama sadece 1 kelime ise
  const parts = q.replace(/[?!.,]/g, "").trim().split(/\s+/);
  if (parts.length === 1 && parts[0].length >= 2) return parts[0];
  return null;
}

async function fetchTDK(kelime) {
  const encoded = encodeURIComponent(kelime);
  const urls = [
    "https://sozluk.gov.tr/gts?ara=" + encoded,
    "https://corsproxy.io/?" + encodeURIComponent("https://sozluk.gov.tr/gts?ara=" + encoded),
    "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://sozluk.gov.tr/gts?ara=" + encoded)
  ];
  for (const url of urls) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(url, {
        signal: ctrl.signal,
        headers: { "Accept": "application/json" }
      });
      clearTimeout(t);
      if (!res.ok) continue;
      const data = await res.json();
      if (!data || data.error || !Array.isArray(data) || data.length === 0) continue;
      return data;
    } catch (e) {
      continue;
    }
  }
  return null;
}

function formatTDK(data, kelime) {
  if (!data || !data[0] || !data[0].anlamlarListe) {
    return null;
  }
  const madde = data[0];
  let out = "📖 TDK Güncel Türkçe Sözlük\n\n";
  out += "« " + (madde.madde || kelime) + " »\n";
  if (madde.lisan) out += "Köken: " + madde.lisan + "\n";
  out += "\n";
  const anlamlar = madde.anlamlarListe || [];
  const limit = Math.min(anlamlar.length, 5);
  for (let i = 0; i < limit; i++) {
    const a = anlamlar[i];
    let ozellik = "";
    if (a.ozelliklerListe && a.ozelliklerListe[0]) {
      ozellik = " (" + a.ozelliklerListe[0].tam_adi + ")";
    }
    out += (i + 1) + ". " + a.anlam + ozellik + "\n";
    if (a.orneklerListe && a.orneklerListe[0]) {
      out += "   Örn: " + a.orneklerListe[0].ornek + "\n";
    }
  }
  if (anlamlar.length > limit) {
    out += "\n… ve " + (anlamlar.length - limit) + " anlam daha (TDK)";
  }
  out += "\n\nKaynak: sozluk.gov.tr (TDK)";
  return out;
}


function isProbablyEnglishWord(w) {
  if (!w || w.length < 2 || w.length > 24) return false;
  // mostly latin letters
  return /^[a-zA-Z][a-zA-Z\-']*[a-zA-Z]?$/.test(w);
}

async function fetchEnglishToTurkish(word) {
  const w = word.trim();
  const results = { tr: null, enDef: null };

  // 1) MyMemory EN→TR
  try {
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(w) + "&langpair=en|tr";
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 7000);
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    if (res.ok) {
      const data = await res.json();
      const tr = data && data.responseData && data.responseData.translatedText;
      if (tr && !/MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(tr) && tr.toLowerCase() !== w.toLowerCase()) {
        results.tr = tr;
      }
    }
  } catch (e) {}

  // 2) Free Dictionary API (English definition)
  try {
    const url2 = "https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(w);
    const ctrl2 = new AbortController();
    const t2 = setTimeout(() => ctrl2.abort(), 7000);
    const res2 = await fetch(url2, { signal: ctrl2.signal });
    clearTimeout(t2);
    if (res2.ok) {
      const data2 = await res2.json();
      if (Array.isArray(data2) && data2[0] && data2[0].meanings && data2[0].meanings[0]) {
        const m = data2[0].meanings[0];
        const pos = m.partOfSpeech || "";
        const def = (m.definitions && m.definitions[0] && m.definitions[0].definition) || "";
        if (def) results.enDef = { pos, def };
      }
    }
  } catch (e) {}

  return results;
}

function formatEnglishWord(word, results) {
  if (!results.tr && !results.enDef) return null;
  let out = "🇬🇧 « " + word + " »\n\n";
  if (results.tr) {
    out += "Türkçe anlam: " + results.tr + "\n";
  }
  if (results.enDef) {
    out += "\nİngilizce tanım";
    if (results.enDef.pos) out += " (" + results.enDef.pos + ")";
    out += ":\n" + results.enDef.def + "\n";
  }
  if (!results.tr && results.enDef) {
    out += "\n(Türkçe çeviri şu an alınamadı; yukarıdaki İngilizce tanımı inceleyebilirsin.)";
  }
  return out;
}


// ---- Matematik ifade hesaplama ----
function looksLikeMathAttempt(query) {
  const s = query.trim();
  // rakam + işlem işareti veya √/sqrt veya sadece işlem denemesi
  if (/[0-9]/.test(s) && /[+\-*/^×÷xX(]|√|sqrt/i.test(s)) return true;
  if (/^[\s√sqrt0-9+\-*/^×÷xX().]+$/i.test(s) && /[+\-*/^×÷]|√|sqrt/i.test(s)) return true;
  return false;
}

function extractMathExpression(query) {
  let s = query.trim();
  s = s.replace(/\s*(kactir|kaçtır|kac eder|kaç eder|nedir|ne demek|esittir|eşittir|=+\s*)\s*$/i, "");
  s = s.trim();
  s = s.replace(/√\s*\(/g, "sqrt(");
  s = s.replace(/√\s*([0-9.]+)/g, "sqrt($1)");
  s = s.replace(/\bsqrt\s*\(/gi, "sqrt(");
  s = s.replace(/\^/g, "**");
  s = s.replace(/[×xX]/g, "*");
  s = s.replace(/÷/g, "/");
  return s;
}

function isCompleteMathExpression(expr) {
  if (!expr || !expr.trim()) return false;
  const s = expr.trim();
  // sonda işlem işareti veya eksik parantez = tamamlanmamış
  if (/[+\-*/.**]\s*$/.test(s.replace(/\*\*/g, "*"))) return false;
  if (/\(\s*$/.test(s)) return false;
  // başta çarpma/bölme (eksi sayı hariç)
  if (/^[*/]/.test(s)) return false;
  // boş parantez
  if (/\(\s*\)/.test(s)) return false;
  // dengeli parantez
  let bal = 0;
  for (const ch of s) {
    if (ch === "(") bal++;
    if (ch === ")") bal--;
    if (bal < 0) return false;
  }
  if (bal !== 0) return false;
  // en az bir rakam
  if (!/[0-9]/.test(s)) return false;
  return true;
}

function safeMathEval(expr) {
  try {
    let code = expr.replace(/sqrt/gi, "Math.sqrt");
    const cleaned = code.replace(/\*\*/g, "").replace(/Math\.sqrt/g, "");
    if (/[^0-9+\-*/().\s,]/.test(cleaned)) return null;
    const fn = new Function("return (" + code + ")");
    const val = fn();
    if (typeof val !== "number" || !isFinite(val)) return null;
    if (Number.isInteger(val)) return String(val);
    return String(Math.round(val * 1e10) / 1e10);
  } catch (e) {
    return null;
  }
}

/** @returns {{ok:true, html:string}|{ok:false, reason:string}|null} null = matematik değil */
function tryMathAnswer(query) {
  const attempt = looksLikeMathAttempt(query);
  if (!attempt && currentSubject !== "matematik") return null;

  const expr = extractMathExpression(query);

  // Matematik dersinde veya işlem benzeri sorguda
  if (currentSubject === "matematik" || attempt) {
    if (!isCompleteMathExpression(expr)) {
      // tamamlanmamış: 7+8+
      if (attempt || (currentSubject === "matematik" && /[0-9+\-*/^√]/.test(query))) {
        return {
          ok: false,
          reason: "⚠️ Lütfen geçerli bir matematiksel işlem girin.\n\nÖrnekler: <b>2^3</b>, <b>15*4</b>, <b>√16</b>, <b>(3+4)*2</b>\n\nSonda işlem işareti bırakmayın (örn. <b>7+8+</b> geçersiz)."
        };
      }
      return null;
    }
    const result = safeMathEval(expr);
    if (result === null) {
      return {
        ok: false,
        reason: "⚠️ Bu işlemi hesaplayamadım. Lütfen geçerli bir matematiksel işlem girin.\n\nÖrnekler: <b>2^3</b>, <b>15*4</b>, <b>√16</b>, <b>25/5</b>"
      };
    }
    let display = query.trim()
      .replace(/\s*(kactir|kaçtır|kac eder|kaç eder|nedir|esittir|eşittir)\s*$/i, "")
      .trim();
    return {
      ok: true,
      html: "🧮 Hesap sonucu\n\n" + display + " = <strong>" + result + "</strong>"
    };
  }
  return null;
}

async function generateResponse(query) {
  const q = normalize(query);
  const wantDetailOnly = /^(detay|daha fazla|anlamadim|anlamadım|acikla|açıkla|genis anlat|geniş anlat|ornek ver|örnek ver|daha detay|daha fazla anlat|anlamadim anlat|anlamadım anlat)\s*$/i.test(query.trim());
  const wantDetail = /detay|daha fazla|anlamadim|anlamadım|acikla|açıkla|genis|geniş|ornek|örnek|nasil olur|nasıl olur|daha detay/.test(q);

  // Sadece "detay" vb.
  if (wantDetailOnly) {
    if (lastTopic && lastTopic.detail) return lastTopic.detail;
    if (lastTopic && lastTopic.short) return lastTopic.short + "\n\n(Bu konu için ek detay kaydı yok.)";
    return "Henüz bir konu seçilmedi. Önce bir soru sor veya hazır konulara tıkla, sonra \"detay\" yaz.";
  }

  // ========== 1) MATEMATİK DERSİ: API YOK ==========
  if (currentSubject === "matematik") {
    const mathAns = tryMathAnswer(query);
    if (mathAns) {
      if (mathAns.ok) return mathAns.html;
      return mathAns.reason; // geçersiz işlem uyarısı
    }
    // Yerel matematik veritabanı
    const found = findAnswer(query);
    if (found) {
      lastTopic = found;
      if (wantDetail && found.detail) return found.detail;
      let resp = found.short;
      if (found.detail) resp += "\n\n💡 Daha detaylı anlatmamı ister misin? \"detay\" veya \"daha fazla anlat\" yaz.";
      return resp;
    }
    return "Matematik dersindeyim. 🔢\n\n• İşlem için: 2^3, 15*4, √16, (3+4)*2\n• Konu için: hazır konulara tıkla veya \"asal sayı nedir\" yaz\n\nTDK / çeviri bu derste çalışmaz.";
  }

  // ========== 2) Diğer derslerde: önce hesap (opsiyonel), sonra yerel KB ==========
  const mathAns = tryMathAnswer(query);
  if (mathAns) {
    if (mathAns.ok) return mathAns.html;
    // genel/diğer derslerde yarım işlem → uyarı (TDK'ye düşme)
    if (looksLikeMathAttempt(query)) return mathAns.reason;
  }

  const found = findAnswer(query);
  if (found) {
    lastTopic = found;
    if (wantDetail && found.detail) return found.detail;
    let resp = found.short;
    if (found.detail) resp += "\n\n💡 Daha detaylı anlatmamı ister misin? \"detay\" veya \"daha fazla anlat\" yaz.";
    return resp;
  }

  // ========== 3) Sözlük API: katı ders izolasyonu ==========
  const word = extractWordForTDK(query);
  const looksLikeDict = word && (/nedir|ne demek|ne anlama|anlamı|anlami|ne demektir|turkce anlami|türkçe anlamı|ingilizcesi|ingilizce anlami|ingilizce anlamı/.test(q) || query.trim().split(/\s+/).length <= 2);
  const explicitEnToTr = /turkce anlami|türkçe anlamı|turkcesi|türkçesi/.test(q);

  // İngilizce API: SADECE İngilizce dersi VEYA açık "Türkçe anlamı"
  if (looksLikeDict && word && isProbablyEnglishWord(word) && (currentSubject === "ingilizce" || explicitEnToTr)) {
    const enRes = await fetchEnglishToTurkish(word);
    const enFormatted = formatEnglishWord(word, enRes);
    if (enFormatted) return enFormatted;
    return "« " + word + " » için İngilizce→Türkçe anlam bulunamadı. 😕";
  }

  // TDK: SADECE Türkçe dersi
  if (currentSubject === "turkce" && looksLikeDict && word) {
    const data = await fetchTDK(word);
    const formatted = formatTDK(data, word);
    if (formatted) return formatted;
    return "« " + word + " » kelimesini TDK Güncel Türkçe Sözlük'te bulamadım. 😕\n\nYazımını kontrol et veya hazır konulara bak.";
  }

  // Genel / diğer: API yok
  if (looksLikeDict && word) {
    if (isProbablyEnglishWord(word)) {
      return "« " + word + " » İngilizce kelimeye benziyor.\nAnlam için **İngilizce** dersini seç veya \"shabby Türkçe anlamı\" yaz.\nTürkçe sözlük için **Türkçe** dersini seç.";
    }
    return "Sözlük araması için **Türkçe** (TDK) veya **İngilizce** dersini seç.\nMüfredat konusu için soldan ilgili dersi açıp hazır konulara tıklayabilirsin.";
  }

  if (/ozet|özet|anlat|konu/.test(q)) {
    return "Hangi konunun özetini istersin? Ders seçip hazır konulara tıklayabilir veya konuyu yazabilirsin.";
  }
  return "Üzgünüm, bu soruyu tam anlayamadım. 😅\n\n• Soldan ders seç\n• Hazır konu butonlarına tıkla\n• Matematik: 2^3, √16\n• Türkçe dersinde: kelime nedir (TDK)\n• İngilizce dersinde: word nedir";
}




function addUserMessage(text) {
  var box = document.getElementById("chatMessages");
  if (!box) return;
  var welcome = box.querySelector(".welcome-box");
  if (welcome) welcome.remove();
  var div = document.createElement("div");
  div.className = "message user";
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function askQuestion(text) {
  var input = document.getElementById("userInput");
  if (input) input.value = text;
  handleSend();
}

function formatBotHtml(text) {
  var s = String(text == null ? "" : text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  s = s.replace(/&lt;strong&gt;/gi, "<strong>").replace(/&lt;\/strong&gt;/gi, "</strong>");
  s = s.replace(/&lt;b&gt;/gi, "<b>").replace(/&lt;\/b&gt;/gi, "</b>");
  s = s.replace(/&lt;br\s*\/?&gt;/gi, "<br>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\n/g, "<br>");
  return s;
}

function unlockUI() {
  try {
    isTyping = false;
    var btn = document.getElementById("sendBtn");
    if (btn) {
      btn.disabled = false;
      btn.removeAttribute("disabled");
      btn.style.pointerEvents = "auto";
      btn.style.opacity = "1";
    }
    var inp = document.getElementById("userInput");
    if (inp) {
      inp.disabled = false;
      inp.removeAttribute("disabled");
    }
  } catch (e) {}
}

function addBotMessage(text, useTyping) {
  if (useTyping === undefined) useTyping = true;
  var box = document.getElementById("chatMessages");
  if (!box) { unlockUI(); return; }
  var welcome = box.querySelector(".welcome-box");
  if (welcome) welcome.remove();

  var safeText = (text == null || text === "")
    ? "⚠️ Bir yanıt oluşturulamadı. Lütfen tekrar dene."
    : String(text);

  var div = document.createElement("div");
  div.className = "message bot";
  var avatar = document.createElement("img");
  avatar.className = "avatar";
  avatar.src = ROBOT_IMG;
  avatar.alt = "Combo";
  var bubble = document.createElement("div");
  bubble.className = "bubble";
  div.appendChild(avatar);
  div.appendChild(bubble);
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;

  function paintFinal() {
    try {
      bubble.innerHTML = formatBotHtml(safeText);
    } catch (err) {
      bubble.textContent = safeText.replace(/<[^>]+>/g, "");
    }
    box.scrollTop = box.scrollHeight;
    unlockUI();
  }

  // Kısa mesajlarda animasyon yok
  if (!useTyping || safeText.length < 18) {
    paintFinal();
    return;
  }

  // Hızlı harf harf yazma (düz metin), bitince HTML format
  isTyping = true;
  var plain = safeText.replace(/<[^>]+>/g, "").replace(/\*\*/g, "");
  var i = 0;
  var speed = 8; // ms — hızlı efekt

  function typeStep() {
    try {
      if (i < plain.length) {
        bubble.textContent = plain.substring(0, i + 1);
        i++;
        box.scrollTop = box.scrollHeight;
        setTimeout(typeStep, speed);
      } else {
        paintFinal();
      }
    } catch (e) {
      paintFinal();
    }
  }
  typeStep();
}

function withTimeout(promise, ms) {
  return new Promise(function (resolve, reject) {
    var done = false;
    var t = setTimeout(function () {
      if (!done) {
        done = true;
        resolve("⏱️ Yanıt zaman aşımına uğradı. Lütfen tekrar dene.");
      }
    }, ms);
    promise.then(function (v) {
      if (!done) {
        done = true;
        clearTimeout(t);
        resolve(v);
      }
    }).catch(function (e) {
      if (!done) {
        done = true;
        clearTimeout(t);
        resolve("⚠️ Bir hata oluştu. Lütfen işlemi kontrol edip tekrar deneyin.");
      }
    });
  });
}

async function handleSend() {
  unlockUI(); // her gönderimde önce aç

  var input = document.getElementById("userInput");
  var text = (input && input.value || "").trim();
  if (!text) return;
  input.value = "";
  addUserMessage(text);

  try {
    var response = await withTimeout(Promise.resolve().then(function () {
      return generateResponse(text);
    }), 12000);
    addBotMessage(response || "⚠️ Eksik veya hatalı bir matematiksel ifade girdiniz. Lütfen işlemi kontrol edin.", true);
  } catch (e) {
    console.error(e);
    addBotMessage("⚠️ Eksik veya hatalı bir matematiksel ifade girdiniz. Lütfen işlemi kontrol edin.", false);
  } finally {
    unlockUI();
  }
}
